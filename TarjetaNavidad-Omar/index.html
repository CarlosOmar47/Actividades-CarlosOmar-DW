  <!-- Actividad 1 -->

  <!DOCTYPE html><!-- esta etiqueta declara el tipo de documento -->
  <html lang="es">
<head>     
<!-- El titulo de la pagina no es visible en el desarrollo pero es lo que funciona para el SEO -->
<title>Tarjeta de Navidad | Personalizados </title>
<!--En la etiqueta head va todo lo que no es visible en la pagina web pero la hace funcional-->
<!-- A continuacion los meta datos para que la pagina reconozca, caracteres especiales, y se adapte a diferentes dispositivos -->
<meta charset="UTF-8"> <!--Este metadato es para los caracteres especiales -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tarjeta de Navidad interactiva, con diseño personalizado.">
  <meta name="author" content="Carlos Omar Rodriguez Medina">

<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link rel="stylesheet" href="styles.css">
</head><!--HASTA AQUI VA EL HEAD-->

<!--AQUI INICIA EL BODY-->
<body>     
<div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="Navidad.jpg" alt="Navidad" class="cover-img">
    </div>
    <h1 class="cover-title">Feliz Navidad 2026 ❤️</h1>
    <p class="cover-subtitle">Con todo el amor del mundo mundial para ti, pasatela super duper </p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Click </span>
    </button>
   </div>
<!-- Mensaje pagina 1 -->
 <div class="page" id="Pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="Foto2.jpg" alt="Arbol de Navidad" />
    </div>
    <p class="msg-text">Disfruta esta navidad como si fuera la primera 🫶❤️</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>

<!-- Mensaje pagina 2 -->
 <div class="page" id="pagina2">
    <h2 class="gallery-title">Te amo mucho 🤗</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="nieve.jpg" alt="Conozcamos nuevas cosas este año" />
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Foto2.jpg" alt="La mejor persona que he conocido en mi vida" />
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="Santa.jpg" alt="Vivamos esta navidad con mucha alegria y amor" />
     </div>
    </div>
  
    <p class="gallery-caption">Estar contigo es lo mejor que me ha pasado en la vida, gracias por existir y por ser parte de mi vida ❤️
   </div>

<script src="script.js"></script>
</body>
  </html>
